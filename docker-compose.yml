services:
  postgres:
    image: postgres:16
    container_name: admitguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admitguard
      POSTGRES_PASSWORD: admitguard_dev_password
      POSTGRES_DB: admitguard_db
    ports:
      - "5432:5432"
    volumes:
      - admitguard_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: admitguard_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  admitguard_postgres_data: